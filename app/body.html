<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-lamp" viewBox="0 0 24 24"><path d="M12 2.6c2.1 2.8 3.2 4.4 3.2 6.2a3.2 3.2 0 0 1-6.4 0c0-1.8 1.1-3.4 3.2-6.2z"/><path d="M4.4 14.2h15.2l-1.9 3.7a3.6 3.6 0 0 1-3.2 1.9H9.5a3.6 3.6 0 0 1-3.2-1.9z"/><path d="M4.4 14.2 2.5 12.8M9 21.6h6"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M3.5 20.5l1.2-4.3L16.4 4.5a2.1 2.1 0 0 1 3 3L7.8 19.3z"/><path d="M14.4 6.5l3 3"/><path d="M12.5 20.5h8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4l5.1 5.1"/><path d="M7.6 10.6l2.1 2.1 3.9-4.2"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.2" rx="2.1"/><rect x="3" y="9.9" width="18" height="4.2" rx="2.1"/><rect x="3" y="15.8" width="18" height="4.2" rx="2.1"/><path d="M6.6 2.4v19.2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6" stroke-dasharray="3.2 2.5" stroke-width="3.2"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2.2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.2 3.2 14.8 0 18M12 3c-3.2 3.2-3.2 14.8 0 18"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5l-6.5 6.5 6.5 6.5"/></symbol>
</svg>

<header class="topbar">
  <div class="topbar-in">
    <button class="brandmini" id="go-home" type="button" aria-label="அறம்"><svg class="ic"><use href="#i-lamp"/></svg><b lang="ta">அறம்</b><small>Aram</small></button>
    <div class="tb-actions">
      <button class="iconbtn" id="btn-lang" type="button" data-i18n-aria="set.ui"><svg class="ic"><use href="#i-globe"/></svg></button>
      <button class="iconbtn" id="btn-set" type="button" data-i18n-aria="set.title"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
  </div>
  <i class="chain" aria-hidden="true"></i>
</header>

<main class="shell">
  <section class="view" id="v-home">
    <div class="hero">
      <div class="medal"><div class="floor" id="medal"></div></div>
      <div class="banner"><h1 lang="ta">அறம்</h1><span class="roman">Aram</span></div>
      <p class="tagline" data-i18n="home.tagline"></p>
    </div>
    <i class="chain" aria-hidden="true"></i>
    <h2 class="h" data-i18n="home.today"></h2>
    <div class="strand" id="today"></div>
    <div class="row"><button type="button" class="btn quiet" id="another" data-i18n="home.another"></button></div>
    <p class="intro" data-i18n="home.intro"></p>
    <div class="quick">
      <button type="button" data-go="ask"><svg class="ic"><use href="#i-ask"/></svg><span data-i18n="nav.ask"></span></button>
      <button type="button" data-go="check"><svg class="ic"><use href="#i-check"/></svg><span data-i18n="nav.check"></span></button>
      <button type="button" data-go="library"><svg class="ic"><use href="#i-library"/></svg><span data-i18n="nav.library"></span></button>
    </div>
  </section>

  <section class="view" id="v-ask" hidden>
    <h2 class="h" data-i18n="nav.ask"></h2>
    <p class="hint" data-i18n="ask.hint"></p>
    <textarea class="write" id="q" dir="auto" data-i18n-ph="ask.placeholder" rows="4"></textarea>
    <div class="langbar" data-langbar></div>
    <div class="row"><button type="button" class="btn" id="ask" data-i18n="ask.go"></button><button type="button" class="btn quiet" id="stop" hidden data-i18n="ask.stop"></button><span class="status" id="ask-status" role="status" aria-live="polite"></span></div>
    <div class="status" data-langstatus role="status"></div>
    <p class="hint" data-i18n="ask.examples"></p>
    <div class="chips" id="examples"></div>
    <div id="ask-out" class="results"></div>
  </section>

  <section class="view" id="v-check" hidden>
    <h2 class="h" data-i18n="nav.check"></h2>
    <p class="hint" data-i18n="check.hint"></p>
    <textarea class="write" id="cq" data-i18n-ph="check.placeholder" rows="5" lang="ta" dir="ltr" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div class="row"><button type="button" class="btn" id="check" data-i18n="check.go"></button><span class="status" id="check-status" role="status" aria-live="polite"></span></div>
    <div id="check-out" class="results"></div>
  </section>

  <section class="view" id="v-library" hidden>
    <div id="shelf-wrap">
      <h2 class="h" data-i18n="nav.library"></h2>
      <div class="langbar" data-langbar style="margin:4px 0 14px"></div>
      <div class="shelf" id="shelf"></div>
    </div>
    <div id="book" hidden class="view">
      <button type="button" class="back" id="book-back"><svg class="ic"><use href="#i-back"/></svg><span data-i18n="lib.all"></span></button>
      <div class="booktitle"><span id="book-en"></span><b id="book-ta" lang="ta"></b></div>
      <div class="langbar" data-langbar></div>
      <div class="status" data-langstatus role="status"></div>
      <input type="hidden" id="bsrc" value="K">
      <select class="pick" id="bch" data-i18n-aria="lib.section" lang="ta"></select>
      <div class="strand" id="browse-out"></div>
    </div>
  </section>
</main>

<nav class="dock" role="tablist" aria-label="Aram">
  <div class="dock-in">
    <button type="button" role="tab" id="d-home" aria-selected="true"><svg class="ic"><use href="#i-lamp"/></svg><span data-i18n="nav.home"></span></button>
    <button type="button" role="tab" id="d-ask" aria-selected="false"><svg class="ic"><use href="#i-ask"/></svg><span data-i18n="nav.ask"></span></button>
    <button type="button" role="tab" id="d-check" aria-selected="false"><svg class="ic"><use href="#i-check"/></svg><span data-i18n="nav.check"></span></button>
    <button type="button" role="tab" id="d-library" aria-selected="false"><svg class="ic"><use href="#i-library"/></svg><span data-i18n="nav.library"></span></button>
  </div>
</nav>
